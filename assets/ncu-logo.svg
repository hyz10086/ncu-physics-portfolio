<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-label="南昌大学 Nanchang University">
  <defs>
    <linearGradient id="ncu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00548B"/>
      <stop offset="100%" stop-color="#0080C6"/>
    </linearGradient>
  </defs>

  <!-- 校徽底盘 -->
  <circle cx="60" cy="60" r="46" fill="url(#ncu)"/>
  <circle cx="60" cy="60" r="37" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="60" cy="60" r="30" fill="#FFFFFF"/>
  <text x="60" y="68" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif"
        font-size="20" font-weight="700" fill="#00548B">NCU</text>
  <circle cx="60" cy="24" r="3.5" fill="#FFC72C"/>

  <!-- 校名 -->
  <text x="128" y="58" font-family="Microsoft YaHei, SimHei, sans-serif"
        font-size="34" font-weight="700" fill="#00548B">南昌大学</text>
  <text x="130" y="88" font-family="Times New Roman, serif"
        font-size="19" letter-spacing="2.6" fill="#3C6E96">NANCHANG UNIVERSITY</text>
</svg>
